name: devcheck
description: Check that the environment has everything the project needs
branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: Release tag to download, e.g. v0.1.0. Defaults to the latest release.
    required: false
    default: latest
  args:
    description: Extra arguments to pass to devcheck. --ci is always passed.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install devcheck
      shell: bash
      env:
        DEVCHECK_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS" in
          Linux)   os=linux  ;;
          macOS)   os=darwin ;;
          Windows) os=windows ;;
          *) echo "devcheck has no binary for $RUNNER_OS"; exit 1 ;;
        esac

        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "devcheck has no binary for $RUNNER_ARCH"; exit 1 ;;
        esac

        ext=""
        if [ "$os" = "windows" ]; then
          ext=".exe"
          if [ "$arch" != "amd64" ]; then
            echo "devcheck only publishes a windows/amd64 binary"
            exit 1
          fi
        fi

        name="devcheck-${os}-${arch}${ext}"

        if [ "$DEVCHECK_VERSION" = "latest" ]; then
          base="https://github.com/vidya381/devcheck/releases/latest/download"
        else
          base="https://github.com/vidya381/devcheck/releases/download/${DEVCHECK_VERSION}"
        fi

        dir="$RUNNER_TEMP/devcheck"
        mkdir -p "$dir"
        curl -fsSL "$base/$name" -o "$dir/devcheck$ext"

        # verify against the release checksums when they are published
        if curl -fsSL "$base/checksums.txt" -o "$dir/checksums.txt"; then
          expected=$(grep " $name\$" "$dir/checksums.txt" | awk '{print $1}')
          if [ -n "$expected" ]; then
            actual=$(sha256sum "$dir/devcheck$ext" | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "checksum mismatch for $name"
              exit 1
            fi
          fi
        fi

        chmod +x "$dir/devcheck$ext"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Run devcheck
      shell: bash
      env:
        DEVCHECK_ARGS: ${{ inputs.args }}
      run: devcheck --ci $DEVCHECK_ARGS
